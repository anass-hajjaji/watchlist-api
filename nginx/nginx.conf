events {
  # Allow nginx to handle up to 1024 simultaneous connections
  worker_connections 1024;
}

http {
  # Define your backend express pool
  upstream watchlist_backend {
    server api:3000;
  }

  # The server block MUST go inside the http block
  server {
    listen 443 ssl;
    server_name localhost;

    # Point Nginx to the mounted volume containing the keys
    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    
    location / {
      proxy_pass http://watchlist_backend;
      
      # Forward the original user's IP to Express
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
  server {
    listen 80;
    server_name localhost;
    
    return 301 https://$host$request_uri;
  }
}