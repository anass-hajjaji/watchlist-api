version: '3.8'

services:
  api:
    build: .
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80" # Only Nginx is exposed to the outside world
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api

  redis:
    image: redis:alpine
    container_name: watchlist_redis
    expose:
      - "6379" # Internal Docker network access only
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: