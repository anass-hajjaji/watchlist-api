version: '3.8'

services:
  api:
    build: .
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:       
      - redis

  redis:
    image: redis:alpine
    container_name: watchlist_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:                 
  redis_data: